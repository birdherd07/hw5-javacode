name: Run PMD Linter

on: [push, pull_request]

jobs:
  pmd-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PMD
        run: |
          PMD_VERSION=$(curl -s https://api.github.com/repos/pmd/pmd/releases/latest | jq -r .tag_name | sed 's/pmd_releases\///')
          wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip
          unzip pmd-dist-${PMD_VERSION}-bin.zip
          mv pmd-bin-${PMD_VERSION} pmd

      - name: Run PMD
        run: |
          ./pmd/bin/pmd check \
            --dir ./docinc/src \
            --rulesets ./java-rules.xml \
            --format text \
            --cache .pmd-cache \
            --fail-on-violation true

      - name: Upload PMD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: pmd-report.txt
