name: Java Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download JUnit Launcher
        run: wget https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar -O ./docinc/lib/junit-standalone.jar

      - name: Compile Code and Tests
        run: |
          mkdir -p bin
          javac -d bin -cp "./docinc/lib/*" ./docinc/src/*.java

      - name: Run JUnit Tests
        # This uses the JUnit Console Launcher
        run: |
          java -cp "bin:lib/*" org.junit.platform.console.ConsoleLauncher \
            --scan-class-path \
            --fail-if-no-tests \
            --reports-dir=test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: test-results
